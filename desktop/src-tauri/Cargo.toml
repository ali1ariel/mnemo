[package]
name = "mnemo-desktop"
version = "1.1.0"
description = "Desktop shell for mnemo"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

# Only for SIGTERM: the release has to be asked to stop, not killed, or
# it never removes its address file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
